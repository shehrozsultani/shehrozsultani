name: Update Profile Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update Projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          username = "shehrozsultani"
          readme = "README.md"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-updater"
          }

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=updated&direction=desc&per_page=100&page={page}"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          repos = [
              repo for repo in repos
              if repo["name"].lower() != username.lower()
              and not repo["archived"]
          ]

          projects = []

          for repo in repos:
              name = repo["name"]
              url = repo["html_url"]
              description = repo["description"] or "No description provided."
              language = repo["language"]

              line = f"- **[{name}]({url})** — {description}"

              if language:
                  line += f" `[{language}]`"

              projects.append(line)

          if projects:
              generated = "\n".join(projects)
          else:
              generated = "_No public projects yet._"

          with open(readme, "r", encoding="utf-8") as f:
              content = f.read()

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          start = content.find(start_marker)
          end = content.find(end_marker)

          if start == -1 or end == -1 or end < start:
              raise SystemExit(
                  "PROJECTS markers were not found in README.md"
              )

          new_content = (
              content[:start + len(start_marker)]
              + "\n"
              + generated
              + "\n"
              + content[end:]
          )

          with open(readme, "w", encoding="utf-8") as f:
              f.write(new_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile projects"
            git push
          fi
