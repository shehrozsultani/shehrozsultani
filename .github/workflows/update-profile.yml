name: Update Profile Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update Projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python <<'PY'
          import base64
          import html
          import json
          import os
          import re
          import urllib.request

          username = "shehrozsultani"
          readme = "README.md"

          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-updater"
          }

          gemini_api_key = os.environ.get("GEMINI_API_KEY")

          # ---------------------------------------------------------
          # GitHub API helper
          # ---------------------------------------------------------

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers=github_headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          # ---------------------------------------------------------
          # Retrieve repository README
          # ---------------------------------------------------------

          def get_readme(repo_name):
              """
              Retrieve and decode a repository README.

              Returns an empty string if the README cannot be retrieved.
              """

              url = (
                  f"https://api.github.com/repos/"
                  f"{username}/{repo_name}/readme"
              )

              try:
                  data = github_get(url)

                  content = data.get("content", "")
                  encoding = data.get("encoding", "")

                  if not content:
                      return ""

                  if encoding == "base64":
                      decoded = base64.b64decode(
                          content.replace("\n", "")
                      ).decode(
                          "utf-8",
                          errors="replace"
                      )
                  else:
                      decoded = content

                  return decoded.strip()

              except Exception:
                  print(
                      f"README unavailable for {repo_name}; "
                      f"using fallback description."
                  )
                  return ""

          # ---------------------------------------------------------
          # Generate Gemini description
          # ---------------------------------------------------------

          def generate_ai_description(repo_name, readme_content):
              """
              Generate a professional project description using Gemini.

              The description can be reasonably detailed.
              It is based only on the repository README.
              """

              if not gemini_api_key or not readme_content:
                  return None

              # Prevent unnecessarily huge requests.
              max_readme_chars = 12000
              readme_excerpt = readme_content[:max_readme_chars]

              prompt = f"""
          You are writing a professional project description for a developer
          portfolio.

          Repository name:
          {repo_name}

          Repository README:
          ---BEGIN README---
          {readme_excerpt}
          ---END README---

          Task:
          Understand what this project actually does and write a polished,
          accurate portfolio description.

          Requirements:
          - Base the description ONLY on the README information provided.
          - Do not invent features, technologies, functionality, users, or
            capabilities that are not supported by the README.
          - Explain the project's actual purpose clearly.
          - A reasonably detailed description is preferred.
          - Usually use around 20–45 words when the README provides enough
            information.
          - It is acceptable to be shorter when the project is simple.
          - Do not make the description unnecessarily long.
          - Professional developer-portfolio tone.
          - No emojis.
          - No Markdown.
          - No bullet points.
          - No quotation marks.
          - Do not mention Gemini, AI generation, or this prompt.
          - Return ONLY the description text.
          """

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-3.6-flash:generateContent"
              )

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": gemini_api_key
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      result = json.load(response)

                  candidates = result.get("candidates", [])

                  if not candidates:
                      return None

                  parts = (
                      candidates[0]
                      .get("content", {})
                      .get("parts", [])
                  )

                  generated_text = "".join(
                      part.get("text", "")
                      for part in parts
                  ).strip()

                  if not generated_text:
                      return None

                  # Clean accidental formatting.
                  generated_text = generated_text.replace(
                      "\n",
                      " "
                  )

                  generated_text = re.sub(
                      r"\s+",
                      " ",
                      generated_text
                  ).strip()

                  generated_text = generated_text.strip(
                      "\"'`"
                  )

                  if not generated_text:
                      return None

                  return generated_text

              except Exception:
                  print(
                      f"Gemini description generation failed for "
                      f"{repo_name}; using fallback."
                  )
                  return None

          # ---------------------------------------------------------
          # Escape text before placing it into HTML
          # ---------------------------------------------------------

          def escape_html(value):
              return html.escape(
                  str(value),
                  quote=True
              )

          # ---------------------------------------------------------
          # Generate one project card
          # ---------------------------------------------------------

          def create_project_card(repo):
              name = repo["name"]
              url = repo["html_url"]

              description = repo.get("description")
              language = repo.get("language")

              # -----------------------------------------------------
              # Existing GitHub description
              # -----------------------------------------------------

              if description and description.strip():
                  final_description = description.strip()

              # -----------------------------------------------------
              # Missing description → README → Gemini
              # -----------------------------------------------------

              else:
                  readme_content = get_readme(name)

                  ai_description = generate_ai_description(
                      name,
                      readme_content
                  )

                  if ai_description:
                      final_description = ai_description
                  else:
                      final_description = (
                          "Software project by Shehroz Sultani."
                      )

              safe_name = escape_html(name)
              safe_description = escape_html(final_description)
              safe_url = escape_html(url)

              # -----------------------------------------------------
              # Language label
              # -----------------------------------------------------

              if language:
                  safe_language = escape_html(language)

                  language_html = (
                      f'<code>⚙️ {safe_language}</code>'
                  )
              else:
                  language_html = ""

              # -----------------------------------------------------
              # Project card
              # -----------------------------------------------------

              card = f"""
          <td width="50%" valign="top">

          <h3>
            🚀 <a href="{safe_url}">{safe_name}</a>
          </h3>

          <p>
            {safe_description}
          </p>

          <p>
            {language_html}
            &nbsp;
            <a href="{safe_url}"><strong>View Project →</strong></a>
          </p>

          </td>
          """

              return card

          # ---------------------------------------------------------
          # 1. Retrieve repositories
          # ---------------------------------------------------------

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=updated&direction=desc"
                  f"&per_page=100&page={page}"
              )

              try:
                  data = github_get(url)

              except Exception as error:
                  raise SystemExit(
                      f"Failed to retrieve repositories: {error}"
                  )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # ---------------------------------------------------------
          # 2. Filter repositories
          # ---------------------------------------------------------

          repos = [
              repo
              for repo in repos
              if repo["name"].lower() != username.lower()
              and not repo.get("archived", False)
              and not repo.get("private", False)
          ]

          # ---------------------------------------------------------
          # 3. Generate project cards
          # ---------------------------------------------------------

          cards = []

          for repo in repos:
              try:
                  card = create_project_card(repo)
                  cards.append(card)

              except Exception:
                  # One bad repository should not stop the entire
                  # profile update.
                  print(
                      f"Failed to generate card for "
                      f"{repo.get('name', 'unknown')}; skipping."
                  )

          # ---------------------------------------------------------
          # 4. Build responsive-ish two-column HTML table
          # ---------------------------------------------------------

          rows = []

          for index in range(0, len(cards), 2):
              first_card = cards[index]

              if index + 1 < len(cards):
                  second_card = cards[index + 1]
              else:
                  second_card = (
                      '<td width="50%" valign="top"></td>'
                  )

              row = f"""
          <tr>
          {first_card}
          {second_card}
          </tr>
          """

              rows.append(row)

          if rows:
              generated = """
          <table>
          """ + "\n".join(rows) + """
          </table>
          """
          else:
              generated = """
          <p align="center">
            <em>No public projects yet.</em>
          </p>
          """

          generated = generated.strip()

          # ---------------------------------------------------------
          # 5. Read profile README
          # ---------------------------------------------------------

          with open(
              readme,
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read()

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          start = content.find(start_marker)
          end = content.find(end_marker)

          # ---------------------------------------------------------
          # Safety check
          # ---------------------------------------------------------

          if start == -1 or end == -1 or end < start:
              raise SystemExit(
                  "PROJECTS markers were not found in README.md. "
                  "README was NOT modified."
              )

          # ---------------------------------------------------------
          # 6. Replace ONLY content between markers
          # ---------------------------------------------------------

          new_content = (
              content[:start + len(start_marker)]
              + "\n\n"
              + generated
              + "\n\n"
              + content[end:]
          )

          # ---------------------------------------------------------
          # 7. Write README
          # ---------------------------------------------------------

          with open(
              readme,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_content)

          print(
              f"Profile Projects section updated successfully "
              f"with {len(cards)} project cards."
          )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile projects"
            git push
          fi
