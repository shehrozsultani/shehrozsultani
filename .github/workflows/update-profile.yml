name: Update Profile Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update Projects section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python <<'PY'
          import base64
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          username = "shehrozsultani"
          readme = "README.md"

          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-updater"
          }

          gemini_api_key = os.environ.get("GEMINI_API_KEY")

          # ---------------------------------------------------------
          # GitHub API
          # ---------------------------------------------------------

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers=github_headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          # ---------------------------------------------------------
          # Get repository README
          # ---------------------------------------------------------

          def get_readme(repo_name):
              url = (
                  f"https://api.github.com/repos/"
                  f"{username}/{repo_name}/readme"
              )

              try:
                  data = github_get(url)

                  content = data.get("content", "")
                  encoding = data.get("encoding", "")

                  if not content:
                      return ""

                  if encoding == "base64":
                      decoded = base64.b64decode(
                          content.replace("\n", "")
                      ).decode(
                          "utf-8",
                          errors="replace"
                      )
                  else:
                      decoded = content

                  return decoded.strip()

              except Exception:
                  print(
                      f"README unavailable for {repo_name}; "
                      f"using fallback description."
                  )
                  return ""

          # ---------------------------------------------------------
          # Gemini description generator
          # ---------------------------------------------------------

          def generate_ai_description(repo_name, readme_content):

              if not gemini_api_key or not readme_content:
                  return None

              max_readme_chars = 12000
              readme_excerpt = readme_content[:max_readme_chars]

              prompt = f"""
          You are writing a professional project description for a developer
          portfolio.

          Repository name:
          {repo_name}

          Repository README:
          ---BEGIN README---
          {readme_excerpt}
          ---END README---

          Write a polished description explaining what this project actually
          does.

          Requirements:

          - Base the description ONLY on the README.
          - Do not invent features or functionality.
          - Be factual and professional.
          - A reasonably detailed description is preferred.
          - Around 20–45 words is ideal when the README provides enough
            information.
          - Shorter is acceptable for simple projects.
          - Do not make it unnecessarily long.
          - No emojis.
          - No Markdown.
          - No bullet points.
          - No quotation marks.
          - Do not mention Gemini or AI generation.
          - Return ONLY the description.
          """

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ]
              }

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-3.6-flash:generateContent"
              )

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": gemini_api_key
                  },
                  method="POST"
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      result = json.load(response)

                  candidates = result.get("candidates", [])

                  if not candidates:
                      return None

                  parts = (
                      candidates[0]
                      .get("content", {})
                      .get("parts", [])
                  )

                  generated_text = "".join(
                      part.get("text", "")
                      for part in parts
                  ).strip()

                  if not generated_text:
                      return None

                  generated_text = generated_text.replace(
                      "\n",
                      " "
                  )

                  generated_text = re.sub(
                      r"\s+",
                      " ",
                      generated_text
                  ).strip()

                  generated_text = generated_text.strip(
                      "\"'`"
                  )

                  if not generated_text:
                      return None

                  return generated_text

              except Exception:
                  print(
                      f"Gemini description generation failed for "
                      f"{repo_name}; using fallback."
                  )
                  return None

          # ---------------------------------------------------------
          # HTML escaping
          # ---------------------------------------------------------

          def escape_html(value):
              return html.escape(
                  str(value),
                  quote=True
              )

          # ---------------------------------------------------------
          # Project icon
          # ---------------------------------------------------------

          def project_icon(repo):

              name = repo["name"].lower()

              icon_map = {
                  "campus-copilot-ai": "🎓",
                  "ai-tic-tac-toe": "🎮",
                  "holidays": "🌍",
                  "python-practice": "🐍",
                  "cpp-learning": "⚡"
              }

              if name in icon_map:
                  return icon_map[name]

              language = (
                  repo.get("language") or ""
              ).lower()

              language_icons = {
                  "python": "🐍",
                  "javascript": "🟨",
                  "typescript": "🔷",
                  "c++": "⚡",
                  "java": "☕",
                  "html": "🌐",
                  "css": "🎨",
                  "shell": "💻",
                  "php": "🐘",
                  "ruby": "💎",
                  "go": "🔵",
                  "rust": "🦀"
              }

              return language_icons.get(
                  language,
                  "🚀"
              )

          # ---------------------------------------------------------
          # Language badge
          # ---------------------------------------------------------

          def language_badge(language):

              if not language:
                  return ""

              safe_language = urllib.parse.quote(
                  language,
                  safe=""
              )

              badge_url = (
                  "https://img.shields.io/badge/"
                  f"Language-{safe_language}-2563EB"
                  "?style=flat-square"
              )

              return (
                  f'<img src="{badge_url}" '
                  f'alt="{escape_html(language)}"/>'
              )

          # ---------------------------------------------------------
          # Create project card
          # ---------------------------------------------------------

          def create_project_card(repo):

              name = repo["name"]
              url = repo["html_url"]

              description = repo.get("description")
              language = repo.get("language")

              # Existing GitHub description wins.
              if description and description.strip():

                  final_description = description.strip()

              else:

                  readme_content = get_readme(name)

                  ai_description = generate_ai_description(
                      name,
                      readme_content
                  )

                  if ai_description:
                      final_description = ai_description

                  else:
                      final_description = (
                          "Software project by Shehroz Sultani."
                      )

              safe_name = escape_html(name)
              safe_description = escape_html(
                  final_description
              )
              safe_url = escape_html(url)

              icon = project_icon(repo)
              badge = language_badge(language)

              card = f"""
          <td width="50%" valign="top">

          <h3>
            {icon}&nbsp;
            <a href="{safe_url}">{safe_name}</a>
          </h3>

          <p>
            {safe_description}
          </p>

          <p>
            {badge}
          </p>

          <p>
            <a href="{safe_url}">
              <strong>View Project →</strong>
            </a>
          </p>

          </td>
          """

              return card

          # ---------------------------------------------------------
          # 1. Retrieve all repositories
          # ---------------------------------------------------------

          repos = []
          page = 1

          while True:

              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=updated&direction=desc"
                  f"&per_page=100&page={page}"
              )

              try:

                  data = github_get(url)

              except Exception as error:

                  raise SystemExit(
                      f"Failed to retrieve repositories: {error}"
                  )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # ---------------------------------------------------------
          # 2. Filter repositories
          # ---------------------------------------------------------

          repos = [
              repo
              for repo in repos

              if repo["name"].lower()
              != username.lower()

              and not repo.get(
                  "archived",
                  False
              )

              and not repo.get(
                  "private",
                  False
              )

              and not repo.get(
                  "fork",
                  False
              )
          ]

          # ---------------------------------------------------------
          # 3. Generate project cards
          # ---------------------------------------------------------

          cards = []

          for repo in repos:

              try:

                  cards.append(
                      create_project_card(repo)
                  )

              except Exception:

                  print(
                      f"Failed to generate card for "
                      f"{repo.get('name', 'unknown')}; "
                      f"using fallback."
                  )

                  safe_name = escape_html(
                      repo.get(
                          "name",
                          "project"
                      )
                  )

                  safe_url = escape_html(
                      repo.get(
                          "html_url",
                          "#"
                      )
                  )

                  cards.append(
                      f"""
          <td width="50%" valign="top">

          <h3>
            🚀 <a href="{safe_url}">
              {safe_name}
            </a>
          </h3>

          <p>
            Software project by Shehroz Sultani.
          </p>

          <p>
            <a href="{safe_url}">
              <strong>View Project →</strong>
            </a>
          </p>

          </td>
          """
                  )

          # ---------------------------------------------------------
          # 4. Build two-column grid
          # ---------------------------------------------------------

          rows = []

          for index in range(
              0,
              len(cards),
              2
          ):

              first_card = cards[index]

              if index + 1 < len(cards):

                  second_card = cards[
                      index + 1
                  ]

              else:

                  second_card = (
                      '<td width="50%" '
                      'valign="top"></td>'
                  )

              rows.append(
                  f"""
          <tr>
          {first_card}
          {second_card}
          </tr>
          """
              )

          if rows:

              generated = (
                  "<table>\n"
                  + "\n".join(rows)
                  + "\n</table>"
              )

          else:

              generated = """
          <p align="center">
            <em>No public projects yet.</em>
          </p>
          """

          generated = generated.strip()

          # ---------------------------------------------------------
          # 5. Read profile README
          # ---------------------------------------------------------

          with open(
              readme,
              "r",
              encoding="utf-8"
          ) as f:

              content = f.read()

          start_marker = (
              "<!-- PROJECTS:START -->"
          )

          end_marker = (
              "<!-- PROJECTS:END -->"
          )

          start = content.find(
              start_marker
          )

          end = content.find(
              end_marker
          )

          # ---------------------------------------------------------
          # Safety check
          # ---------------------------------------------------------

          if (
              start == -1
              or end == -1
              or end < start
          ):

              raise SystemExit(
                  "PROJECTS markers were not found "
                  "in README.md. README was NOT modified."
              )

          # ---------------------------------------------------------
          # 6. Replace ONLY project section
          # ---------------------------------------------------------

          new_content = (
              content[
                  :start + len(start_marker)
              ]

              + "\n\n"

              + generated

              + "\n\n"

              + content[end:]
          )

          # ---------------------------------------------------------
          # 7. Write README
          # ---------------------------------------------------------

          with open(
              readme,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  new_content
              )

          print(
              "Profile Projects section "
              f"updated successfully with "
              f"{len(cards)} project cards."
          )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile projects"
            git push
          fi
